name: Debug APK (TITAN)

# Compila um APK de debug (instalavel via adb, sem chave de assinatura)
# e o publica como artefato para download. Roda no Linux (Ubuntu), igual ao
# build oficial, evitando a dor de compilar FFmpeg/OpenSSL no Windows.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Build debug APK (armeabi-v7a)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-armeabi-v7a
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
